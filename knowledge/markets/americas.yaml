# Market profiles — the Americas.
#
# Curated reference data for certification / homologation engineers. Every entry is
# hand-authored from domain knowledge and MUST be confirmed against the named authority
# before it is relied on for a certification decision. `confidence` reflects how
# settled / well-documented the regime is, not a guarantee:
#   high   — stable, well-documented regime; details unlikely to be wrong
#   medium — structure is right, specific instruments/dates may have moved
#   low    — thin public documentation; treat as a starting pointer only
# `un_1958` / `un_1998`: true / false, or null when not verified.
# Schema is enforced by scripts/knowledge.py (run as part of scripts/build.py).

- code: US
  name: United States
  group: North America
