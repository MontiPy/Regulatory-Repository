  aliases: [USA, America, Puerto Rico, Guam]
  drive: LHD
  regime: self-certification
  basis: FMVSS (49 CFR Part 571) + EPA/CARB criteria-pollutant emissions + NHTSA CAFE
  un_1958: false
  un_1998: true
  authorities:
    - { name: NHTSA, scope: "Vehicle safety (FMVSS), recalls, CAFE, theft, EDR", url: "https://www.nhtsa.gov" }
    - { name: US EPA, scope: "Exhaust/evap emissions, fuel-economy test procedures & labels, refrigerants (SNAP)", url: "https://www.epa.gov/ve-certification" }
    - { name: California Air Resources Board (CARB), scope: "California + Section 177 states emissions/ZEV (LEV IV, ACC II)", url: "https://ww2.arb.ca.gov" }
    - { name: FCC, scope: "Intentional radiators (keyless entry, radar, telematics) — 47 CFR Part 15/95", url: "https://www.fcc.gov/oet/ea" }
  accepts: []
  marks:
    - "Certification label on door pillar (49 CFR 567) — manufacturer certifies compliance with all applicable FMVSS, bumper (Part 581) and theft (Part 541) standards"
    - "Tire & loading information placard (FMVSS 110)"
    - "EPA Certificate of Conformity + Vehicle Emission Control Information (VECI) label (40 CFR 86/1066)"
    - "Monroney window sticker (15 U.S.C. 1232) with EPA/NHTSA fuel economy & environment label (40 CFR 600 Subpart D)"
    - "Parts marking for high-theft lines (49 CFR 541) unless exempted under Part 543"
  emissions: "EPA Tier 3 → 2027+ criteria-pollutant standards. EPA rescinded the GHG endangerment finding and ALL federal vehicle GHG standards (final rule published 18 Feb 2026). CARB LEV III applies in California; the federal waiver for Advanced Clean Cars II (LEV IV / ZEV) was revoked by Congress under the CRA (12 Jun 2025) and is in litigation. Fuel economy: NHTSA CAFE reset for MY2022–2031 (SAFE Vehicles Rule III, FR 30 Sep 2026, effective 30 Nov 2026; credit trading eliminated)."
  language: English (Spanish additionally expected for Puerto Rico consumer information)
  process:
    - "Register as a manufacturer: Part 565 VIN-decoder/manufacturer-identifier submission at least 60 days before affixing the first VIN, and Part 566 manufacturer identification within 30 days of beginning manufacture."
    - "Foreign manufacturers designate a US agent for service of process (49 CFR 551 Subpart D)."
    - "Self-certify to every applicable FMVSS — no government pre-approval; keep a test/engineering file because NHTSA's OVSC runs post-sale compliance tests."
    - "Obtain EPA (and CARB Executive Order where sold in CA/§177 states) Certificate of Conformity BEFORE introduction into commerce."
    - "Import: CBP entry with HS-7 declaration (box 2A for conforming vehicles) and EPA Form 3520-1."
    - "Post-market: defect & noncompliance reports within 5 working days (Part 573), owner notification (Part 577), quarterly Early Warning Reporting (Part 579)."
  watch:
    - "FMVSS 127 — AEB incl. pedestrian AEB for light vehicles (final rule 2024; compliance phase-in from Sept 2029; subject to reconsideration petitions)."
    - "FMVSS 305a — EV electrical safety incl. REESS (final rule 2024)."
    - "Rear-seat belt reminder (FMVSS 208 amendment) and proposed heavy-vehicle AEB."
    - "Connected-vehicle import/sale prohibition for VCS/ADS hardware & software tied to China/Russia (15 CFR 791, BIS, final rule Jan 2025; software MY2027, hardware MY2030)."
  notes:
    - "States cannot set different safety standards (federal preemption), but CARB and §177 states set emissions; Massachusetts has a telematics right-to-repair law."
    - "Low-volume / small manufacturers: Part 555 temporary exemptions; replica vehicle program (Part 586)."
    - "Gray-market imports must be brought into compliance by a Registered Importer (Part 592) and are only possible for vehicles NHTSA has determined eligible (Part 593)."
  records: [us-cfr-part-567, us-cfr-part-565, us-cfr-part-566, us-cfr-part-573, us-cfr-part-577, us-cfr-part-579, us-cfr-part-541, us-cfr-part-581, us-cfr-part-563, us-cfr-part-551, us-cfr-part-555, us-cfr-part-592, us-40cfr-part-86, us-40cfr-part-600, us-40cfr-part-1066, us-47cfr-part-15, us-stub-title-13-ccr-1961-4-1962-4-1962-8, us-stub-massachusetts-general-laws-chapter-93k-acts-of-2020-chapter-386, us-stub-california-proposition-65]
  confidence: high

- code: CA
  name: Canada
  group: North America
  regions: [CA]
  drive: LHD
  regime: self-certification
  basis: CMVSS under the Motor Vehicle Safety Act / Motor Vehicle Safety Regulations (C.R.C., c. 1038) — closely harmonized with FMVSS
  un_1958: false
  un_1998: true
  authorities:
    - { name: Transport Canada (Motor Vehicle Safety), scope: "CMVSS, defect/recall, import", url: "https://tc.canada.ca/en/road-transportation/motor-vehicle-safety" }
    - { name: Environment and Climate Change Canada (ECCC), scope: "On-Road Vehicle & Engine Emission Regs, GHG, ZEV availability standard", url: "https://www.canada.ca/en/environment-climate-change.html" }
    - { name: ISED Canada, scope: "Radio equipment certification (RSS-Gen, ICES)", url: "https://ised-isde.canada.ca" }
    - { name: Registrar of Imported Vehicles (RIV), scope: "Admissibility of US-certified vehicles imported after first retail sale", url: "https://www.riv.ca" }
  accepts:
    - "US-certified vehicles are admissible via the RIV program when on Transport Canada's admissibility list (generally used/personal imports)"
    - "Several CMVSS expressly allow UN Regulation or FMVSS alternatives (e.g. lighting, head restraints, glazing) — check each standard's text"
  marks:
    - "Compliance label: either the National Safety Mark (Canadian manufacturers, authorized by TC) or a Statement of Compliance label (importers/foreign manufacturers) — MVSR s.6 / s.7"
    - "Tire information placard and bilingual labelling"
  emissions: "ECCC On-Road Vehicle and Engine Emission Regulations (aligned with US EPA Tier 3 criteria pollutants). GHG: Canada keeps its own passenger-car/light-truck GHG regulations (no longer mirrors the US after the 2026 US repeal); amendments tightening them for MY2027–2032 were proposed in Canada Gazette I (15 Aug 2026). The Electric Vehicle Availability Standard's 2026 target was paused (Sep 2025) and its repeal proposed (draft regulations, comments to 29 Oct 2026)."
  language: "English AND French for labels, owner's manual safety content, and recall notices"
  process:
    - "Self-certify to applicable CMVSS (largely FMVSS-equivalent; Canadian-unique items include daytime running lamps (CMVSS 108), immobilization system (CMVSS 114), bilingual telltales/labels)."
    - "Apply the compliance label; foreign manufacturers/importers file the importer's declaration (Form 1) at the border."
    - "Emissions: ECCC accepts EPA certification evidence for vehicles sold concurrently in the US; maintain evidence of conformity."
    - "Post-market: notice of defect to the Minister and owners (MVSA s.10); Transport Canada can order recalls since 2018 amendments."
  watch:
    - "CMVSS updates tracking FMVSS 127 (AEB) and EV safety amendments."
    - "EVAS repeal and replacement GHG standards for MY2027–2032 (Canada Gazette I, Aug 2026) — final regulations pending."
  notes:
    - "Canada-unique: DRL required on all new vehicles; immobilizer required; metric/bilingual displays."
  records: [ca-workbook-reg-0358-motor-vehicle-safety-regulations-c-r-c-c-1038, ca-mvsr-c-r-c---c--1038-s108, ca-mvsr-c-r-c---c--1038-s114, ca-mvsr-sor-2003-2, ca-mvsr-sor-2010-201, ca-mvsr-sor-2013-198, ca-workbook-reg-0569-ised-radio-equipment-certification-rss-gen-ices]
  confidence: high

