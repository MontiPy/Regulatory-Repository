# Requirement crosswalk — "what is this requirement called in each market?"
#
# One row per requirement topic, one column per major regulatory regime. Each cell gives
# the governing citation(s) and, where the instrument is in this repository, the record
# ids (validated at build time — an unknown id fails the build).
#
# Cell fields:
#   cite     (required) human-readable citation(s)
#   records  (optional) repository record ids
#   status   (optional) mandatory (default) | phase-in | proposed | voluntary | none
#   note     (optional) short engineering note (differences, phase-in dates, alternatives)
# An absent cell means "not mapped yet" — NOT "no requirement". Use status: none to state
# that a market has no regulatory requirement for the topic.
#
# Curated reference: citations reflect the editor's knowledge as of the file's
# `reviewed` date and must be confirmed against the source text before certification use.

reviewed: "2026-10-04"

columns:
  - { key: US,  label: "United States", short: "US · FMVSS", market: US }
  - { key: CA,  label: "Canada", short: "CA · CMVSS", market: CA }
  - { key: UN,  label: "UN Regulations (1958 Agreement)", short: "UN R", market: EU }
  - { key: EU,  label: "European Union", short: "EU", market: EU }
  - { key: JP,  label: "Japan", short: "JP", market: JP }
  - { key: KR,  label: "South Korea", short: "KR · KMVSS", market: KR }
  - { key: CN,  label: "China", short: "CN · GB", market: CN }
  - { key: IN,  label: "India", short: "IN · AIS/CMVR", market: IN }
  - { key: AU,  label: "Australia", short: "AU · ADR", market: AU }
  - { key: BR,  label: "Brazil", short: "BR · CONTRAN", market: BR }
  - { key: GCC, label: "GCC (GSO / SASO)", short: "GCC · GSO", market: SA }

groups:
  - Market access & administration
  - Crash protection
  - Restraints & seating
  - Child occupant safety
  - Braking & stability
  - Driver assistance & automation
  - Lighting & visibility
  - Controls, displays & signals
  - Tyres & wheels
  - Body, interior & exterior
  - Electrified & alternative powertrains
  - Emissions, energy & environment
  - Electronics, connectivity & cybersecurity
  - Theft protection

